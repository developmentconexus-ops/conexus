name: AWS platform

# The lake's platform in the AWS account, before the Hub that uses it (card L7): called by Publish
# ahead of its deploy, and run by hand on main for the proof that spends no version name
# (delivery L17). It enters AWS through GitHub's OIDC, with no stored key: the Release role trusts
# only this repository's `production` environment, so a job without it is refused.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-platform
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund -w @conexus/infra-aws
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: conexus-release
      # The repository's tags are immutable: a commit already published keeps its image, and the
      # digest the platform points at is read back from the repository either way.
      - name: The copy image
        id: copy-image
        env:
          REPOSITORY: conexus-copia
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$REPOSITORY:$GITHUB_SHA"
          if ! aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            docker build --platform linux/amd64 --file apps/extraction/Dockerfile --tag "$image" .
            docker run --rm --entrypoint tap-conexus "$image" --about
            docker run --rm --entrypoint meltano "$image" --version
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            docker push "$image"
          fi
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: The platform
        working-directory: infra/aws
        env:
          BUDGET_USD: ${{ vars.AWS_BUDGET_USD }}
          ALARM_EMAIL: ${{ vars.AWS_ALARM_EMAIL }}
          HUB_SOURCE_IP: ${{ vars.HUB_SOURCE_IP }}
          COPY_IMAGE_DIGEST: ${{ steps.copy-image.outputs.digest }}
        run: |
          npx cdk deploy PlatformStack --require-approval never --outputs-file "$RUNNER_TEMP/platform.json" \
            --parameters "BudgetUsd=$BUDGET_USD" \
            --parameters "AlarmEmail=$ALARM_EMAIL" \
            --parameters "HubSourceIp=$HUB_SOURCE_IP" \
            --parameters "CopyImageDigest=$COPY_IMAGE_DIGEST"
      # The address is the platform's TemplatesBucket and TemplatesPrefix, then <sha-256 of the file>.json.
      # A version already there is never rewritten: the bucket refuses a put without If-None-Match,
      # and with it answers 412, which counts as done.
      - name: The lake template
        run: |
          bucket="$(jq -r 'first(.[]).TemplatesBucket' "$RUNNER_TEMP/platform.json")"
          prefix="$(jq -r 'first(.[]).TemplatesPrefix' "$RUNNER_TEMP/platform.json")"
          version="$(sha256sum infra/aws/lake.template.json | cut -d ' ' -f 1)"
          if ! out="$(aws s3api put-object --bucket "$bucket" --key "$prefix$version.json" \
            --body infra/aws/lake.template.json --content-type application/json --if-none-match '*' 2>&1)"; then
            if ! grep -q PreconditionFailed <<<"$out"; then
              echo "$out"
              exit 1
            fi
            echo "$prefix$version.json was already published"
          fi
