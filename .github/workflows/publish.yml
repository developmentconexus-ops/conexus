name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: hub-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/developmentconexus-ops/conexus-hub

# Every job checks out github.sha, the commit the runner's hook checked: the tag can move after the
# event.
jobs:
  # A GitHub-hosted machine, new for each job, so nothing an earlier job left behind reaches main's
  # image. Only the digest crosses to the server's runner. Every job there names the environment
  # `production`, whose deployment rules admit only main and v* tags: GitHub's own gate beside the
  # runner's hook.
  image:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: The release is a version name on a commit of main
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not a version name"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit of $VERSION is not on main"
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/hub.Dockerfile
          push: true
          provenance: false
          build-args: CONEXUS_VERSION=${{ github.event.release.tag_name }}
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
      - id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Keep the images of the last ten versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: conexus-hub
          package-type: container
          min-versions-to-keep: 10

  # The two versions of Recados the founder sends from Configurações (P1 A), built from the Release's
  # commit on a GitHub-hosted machine once the image job found that commit on main. The build runs
  # every dependency's install with a read-only token; only the next job, with no checkout and no
  # npm, may write to the Release.
  apps:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: npm run app:pack
      - working-directory: dist/apps
        run: |
          for folder in recados-1 recados-2 recados-nao-inicia recados-defeito recados-laco; do
            zip --quiet --recurse-paths "$folder.zip" "$folder"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recados
          path: |
            dist/apps/recados-*.zip
          if-no-files-found: error
          retention-days: 1

  apps-release:
    needs: apps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recados
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload "$VERSION" recados-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: image
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REFERENCE: ${{ needs.image.outputs.reference }}
        run: infra/deploy.sh "$REFERENCE"
      # Voltar atrás deploys only what is recorded here: a tag can be rewritten, a digest cannot.
      - env:
          VERSION: ${{ github.event.release.tag_name }}
          REFERENCE: ${{ needs.image.outputs.reference }}
        run: infra/releases.sh record "$VERSION" "$REFERENCE"

  # After the Hub, from the Release's own commit. A failed step fails the Release; the Hub stays
  # new and each Worker already published stays, and the rest keep the previous code.
  edge:
    needs: deploy
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - if: ${{ hashFiles('apps/edge/package.json') != '' }}
        uses: ./.github/actions/install
      - run: infra/publish-edge.sh
