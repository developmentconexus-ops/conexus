name: hang probe (temporary)

# Temporary: catches the shard that stops printing and dumps the runner and its child. Removed
# before the pull request is opened.
on:
  push:
    branches: [feat/conexus-ci-server-hang]

permissions:
  contents: read

env:
  CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
  NODE_COMPILE_CACHE: /tmp/node-compile-cache

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [head-1, head-2, head-3]
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] probe
      - uses: ./.github/actions/test-database # zizmor: ignore[self-repository] probe
        with:
          port: ${{ job.services.postgres.ports['5432'] }}
      - run: sudo apt-get install -y gdb >/dev/null 2>&1 || true
      - name: run the shard, dump on silence
        env:
          LANE: ${{ matrix.lane }}
          TEST_SHARD: 3/6
        run: |
          set +e
          dump() {
            local root=$1
            echo "::group::SILENT $2"
            tail -5 /tmp/run.log
            ps -eo pid,ppid,stat,etime,wchan:30,comm --forest | grep -E 'node|npm|sh|MainThread' | grep -v grep
            for p in $(pgrep -x MainThread); do
              echo "== pid $p ppid $(awk '{print $4}' /proc/$p/stat) $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-150)"
              grep -E 'State|Threads|SigPnd|ShdPnd|SigBlk|SigCgt' /proc/$p/status
              for t in /proc/$p/task/*; do echo "  $(basename $t) $(cat $t/comm) $(awk '{print $3}' $t/stat) wchan=$(cat $t/wchan)"; done
              sudo bash -c "for t in /proc/$p/task/*; do echo \"-- kernel stack \$t\"; cat \$t/stack; done" | head -80
              sudo gdb -p $p -batch -ex 'thread apply all bt' 2>&1 | grep -v '^\[New LWP' | tail -120
              ls -l /proc/$p/fd | tail -40
            done
            echo "::endgroup::"
          }
          runs=25; [ "${LANE#full}" != "$LANE" ] && runs=2
          for i in $(seq 1 $runs); do
            rm -rf /tmp/node-compile-cache
            if [ "${LANE#full}" != "$LANE" ]; then
              npm test -w @conexus/server > /tmp/run.log 2>&1 &
            else
              (cd apps/server && npm run build >/dev/null 2>&1 && MASTRA_AGENT_THREAD_LEASE_TTL_MS=3000 node --test --test-concurrency=1 --test-force-exit --test-timeout=120000 --test-reporter=../../scripts/test-reporter.ts $(node ../../scripts/server-shards.ts 3/6 | head -4)) > /tmp/run.log 2>&1 &
            fi
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              sleep 5
              age=$(( $(date +%s) - $(stat -c %Y /tmp/run.log) ))
              if [ $age -gt 60 ]; then dump $pid "run $i"; pkill -KILL -f -- '--test'; break; fi
            done
            wait $pid; echo "run $i exit=$? lines=$(wc -l < /tmp/run.log)"
          done
