name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deps
      - run: npm run knip
      - run: npm run docs
      - run: npm run suppressions
      - name: Approval of the step card
        run: npm run approval -- ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      - name: The method stays frozen while a step is in construction
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run method-freeze -- --base "origin/${{ github.base_ref }}" --labels "$LABELS"
      - name: The migrations keep the previous image running
        if: github.event_name == 'pull_request'
        run: npm run migrations -- --base "origin/${{ github.base_ref }}"
      - name: List the new dependencies
        if: github.event_name == 'pull_request'
        run: npm run new-dependencies -- --base "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_DATABASE_URL: postgres://conexus_owner:ci-owner@localhost:5432/postgres
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The owner of the test databases is not a superuser
        run: >-
          psql postgres://postgres:ci-superuser@localhost:5432/postgres
          -c "create role conexus_owner login createdb createrole password 'ci-owner'"
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The image builds
        run: docker build --file infra/hub.Dockerfile --build-arg CONEXUS_VERSION=v0.0.0 --tag conexus-hub:ci .
      - name: The image carries the migration label and defines no NODE_ENV
        run: |
          label="$(docker image inspect --format '{{ index .Config.Labels "conexus.migrate" }}' conexus-hub:ci)"
          if [ "$label" != "1" ]; then
            echo "the image lacks the label conexus.migrate=1, so deploy.sh would skip migrate"
            exit 1
          fi
          if docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' conexus-hub:ci | grep -q '^NODE_ENV='; then
            echo "the image defines NODE_ENV"
            exit 1
          fi

  ci:
    if: always()
    needs: [check, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.test.result }} ${{ github.event_name == 'pull_request' && needs.image.result || 'success' }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a job ended as $result"
              exit 1
            fi
          done
