name: conexus

# The log is a file the engine rotates: ten megabytes a file, five files a service, so it never fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  hub:
    logging: *logging
    image: ${HUB_IMAGE:?HUB_IMAGE must name the image by digest}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    secrets:
      - hub_database_url
      - hub_mastra_database_url
      - hub_session_secret
      - hub_mail_token
      - hub_neon_api_key
      - hub_app_login_key
      - hub_cloudflare_apps_token
      - hub_seal_keys
      - hub_git_copy_key
      - hub_e2b_api_key
    volumes:
      - hub_git:/var/lib/conexus/git
    # HUB_MAIL_API_URL, HUB_MAIL_FROM, HUB_NEON_ORG_ID, HUB_CLOUDFLARE_ACCOUNT_ID and
    # HUB_GIT_COPY_BUCKET and HUB_INSTALLATION_ID: they name accounts, so they stay out of Git.
    env_file: /etc/conexus/hub.env
    environment:
      HUB_DATABASE_URL_FILE: /run/secrets/hub_database_url
      # Mastra's own database and login, beside the Hub's (decision 0010).
      HUB_MASTRA_DATABASE_URL_FILE: /run/secrets/hub_mastra_database_url
      HUB_PUBLIC_ORIGIN: https://hub.conexus.fun
      HUB_SESSION_SECRET_FILE: /run/secrets/hub_session_secret
      HUB_MAIL_TOKEN_FILE: /run/secrets/hub_mail_token
      HUB_NEON_API_URL: https://console.neon.tech/api/v2
      HUB_NEON_API_KEY_FILE: /run/secrets/hub_neon_api_key
      # The dispatcher's listener, reached over the Tunnel by Workers VPC: never under `ports:` (0041).
      HUB_EDGE_PORT: "8081"
      HUB_APPS_DOMAIN: conexusapp.tech
      # The apps' Workers and logins (decision 0043): the key the dispatcher holds too, and a token
      # apart from the edge's publish token.
      HUB_APP_LOGIN_KEY_FILE: /run/secrets/hub_app_login_key
      HUB_CLOUDFLARE_API_URL: https://api.cloudflare.com/client/v4
      HUB_CLOUDFLARE_APPS_TOKEN_FILE: /run/secrets/hub_cloudflare_apps_token
      HUB_APPS_NAMESPACE: conexus-apps
      # The installation's seal keys (security S32, S33): the last line seals, the others only open.
      HUB_SEAL_KEYS_FILE: /run/secrets/hub_seal_keys
      # The apps' repositories on the server, and the key of the private R2 bucket that copies them
      # (decision 0051).
      HUB_GIT_ROOT: /var/lib/conexus/git
      HUB_GIT_COPY_KEY_FILE: /run/secrets/hub_git_copy_key
      # The build machines (decision 0051): the account's E2B key, and the template infra/e2b built.
      HUB_E2B_API_KEY_FILE: /run/secrets/hub_e2b_api_key
      HUB_E2B_TEMPLATE: conexus-builder
      # The router's registry is the one bundled in the image, never refreshed (decision 0049).
      MASTRA_OFFLINE: "1"
      # Mastra's usage telemetry never leaves: no allowlist covers it (security S42).
      MASTRA_TELEMETRY_DISABLED: "1"
    # CLIProxyAPI's processes (a Google sign-in's, a Google account's calls) keep their config and
    # login folder under /tmp, in memory, never on disk (S36).
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.HUB_PORT + '/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    logging: *logging
    image: ${HUB_IMAGE:?HUB_IMAGE must name the image by digest}
    init: true
    profiles:
      - migrate
    restart: "no"
    command: ["node", "apps/server/src/main.ts", "migrate"]
    secrets:
      - hub_database_url
      - hub_mastra_database_url
      - hub_migration_database_url
    environment:
      HUB_DATABASE_URL_FILE: /run/secrets/hub_database_url
      HUB_MASTRA_DATABASE_URL_FILE: /run/secrets/hub_mastra_database_url
      HUB_MIGRATION_DATABASE_URL_FILE: /run/secrets/hub_migration_database_url

  cloudflared:
    logging: *logging
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    init: true
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      hub:
        condition: service_healthy

volumes:
  hub_git:

secrets:
  tunnel_token:
    file: /etc/conexus/secrets/tunnel_token
  hub_database_url:
    file: /etc/conexus/secrets/hub_database_url
  hub_mastra_database_url:
    file: /etc/conexus/secrets/hub_mastra_database_url
  hub_migration_database_url:
    file: /etc/conexus/secrets/hub_migration_database_url
  hub_session_secret:
    file: /etc/conexus/secrets/hub_session_secret
  hub_mail_token:
    file: /etc/conexus/secrets/hub_mail_token
  hub_neon_api_key:
    file: /etc/conexus/secrets/hub_neon_api_key
  hub_app_login_key:
    file: /etc/conexus/secrets/hub_app_login_key
  hub_cloudflare_apps_token:
    file: /etc/conexus/secrets/hub_cloudflare_apps_token
  hub_seal_keys:
    file: /etc/conexus/secrets/hub_seal_keys
  hub_git_copy_key:
    file: /etc/conexus/secrets/hub_git_copy_key
  hub_e2b_api_key:
    file: /etc/conexus/secrets/hub_e2b_api_key
