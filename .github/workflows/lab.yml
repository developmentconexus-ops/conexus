# Laboratório da trilha de dados: medições na VPS, só no ramo do laboratório. Nunca no main.
# Roda no executor da VPS (o mesmo do deploy), sem o ambiente production e sem segredos.
name: lab
on:
  push:
    branches: [claude/wizardly-edison-fgdnyp]
    paths: ["lab/**", ".github/workflows/lab.yml"]
permissions:
  contents: read
concurrency:
  group: lab
  cancel-in-progress: false
jobs:
  medir:
    runs-on: [self-hosted, hub]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latencias a partir da VPS
        run: bash lab/latencias.sh | tee lab-resultado.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-resultado
          path: lab-resultado.txt
          retention-days: 30
