name: Criar a primeira pessoa

on:
  workflow_dispatch:
    inputs:
      name:
        description: Nome da pessoa
        required: true
        type: string
      email:
        description: E-mail da pessoa
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hub-server
  cancel-in-progress: false

jobs:
  first-person:
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The link goes to the run's summary only: the command writes it to stdout, which never
      # reaches the log, and writes its own log lines to stderr.
      - name: Criar a pessoa e o link de uso único
        env:
          PERSON_NAME: ${{ inputs.name }}
          PERSON_EMAIL: ${{ inputs.email }}
        run: |
          compose=(docker compose --file infra/compose.yaml)
          id="$(HUB_IMAGE=ps-only "${compose[@]}" ps --quiet hub)"
          if [ -z "$id" ]; then
            echo "no Hub is running" >&2
            exit 1
          fi
          image="$(docker inspect --format '{{.Config.Image}}' "$id")"
          HUB_IMAGE="$image" timeout 120 "${compose[@]}" run --rm --no-deps -T hub \
            node apps/server/src/main.ts first-person \
            --name "$PERSON_NAME" --email "$PERSON_EMAIL" --summary /dev/stdout \
            >> "$GITHUB_STEP_SUMMARY"
