name: Prova da regra de tags

on:
  push:
    branches: [feat/conexus-release-pelo-merge-g1]

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --include --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/vprova-regra -f sha="$GITHUB_SHA" || true
