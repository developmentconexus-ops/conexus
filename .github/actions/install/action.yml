name: Install
description: The pinned Node, with the npm cache, and the locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
