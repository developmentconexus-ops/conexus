name: Publish

# Publishing is the merge of a pull request that changes only the note (decision 0081): the push to
# main that brings it runs this once, and nothing else does.
on:
  push:
    branches: [main]
    paths: [releases/note.md]

permissions:
  contents: read

concurrency:
  group: hub-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/developmentconexus-ops/conexus-hub

# Every job checks out github.sha, the commit the runner's hook checked: main can move after the
# event.
jobs:
  # The note's version, from the one owner of its name (scripts/release-note.ts), which refuses a
  # version already tagged: a path filter can run on a push that did not change the note.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.note.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: note
        run: node scripts/release-note.ts publish "$RUNNER_TEMP/note.md" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: note
          path: ${{ runner.temp }}/note.md
          if-no-files-found: error
          retention-days: 1

  # The tag and the Release, with the note, on the merge commit, before anything is built. No
  # checkout and no npm, since this job's token writes to the repository. What this token creates
  # starts no workflow, so the rest follows by `needs`, in this run.
  release:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: note
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file note.md --repo "$GITHUB_REPOSITORY"

  # A GitHub-hosted machine, new for each job, so nothing an earlier job left behind reaches main's
  # image. Only the digest crosses to the server's runner. Every job there names the environment
  # `production`, whose deployment rules admit only main and v* tags: GitHub's own gate beside the
  # runner's hook.
  image:
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/hub.Dockerfile
          push: true
          provenance: false
          build-args: CONEXUS_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
      - id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Keep the images of the last ten versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: conexus-hub
          package-type: container
          min-versions-to-keep: 10

  # The Builder's E2B template from the merge commit, on a GitHub-hosted machine once the image is
  # built: the SDK the Hub's image expects travels with it, so the deploy never pairs a new Hub with
  # an old template. Every publish builds; E2B reuses the cached layers of an unchanged one. The key
  # reaches only the build step. A failed build or proof fails the run before the deploy, and the
  # running Hub keeps its image and template.
  template:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      template: ${{ steps.build.outputs.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - id: build
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          set -o pipefail
          line="$(node infra/e2b/template.ts | tee /dev/stderr | tail -n 1)"
          if ! [[ "$line" =~ ^HUB_E2B_TEMPLATE=(conexus-builder:[0-9a-f]{7,40})$ ]]; then
            echo "the build did not end with the template's name"
            exit 1
          fi
          echo "template=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  # The two versions of Recados the founder sends from Configurações (P1 A), built from the merge
  # commit on a GitHub-hosted machine once the image is built. The build runs
  # every dependency's install with a read-only token; only the next job, with no checkout and no
  # npm, may write to the Release.
  apps:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: npm run app:pack
      - working-directory: dist/apps
        run: |
          for folder in recados-1 recados-2 recados-nao-inicia recados-defeito recados-laco; do
            zip --quiet --recurse-paths "$folder.zip" "$folder"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recados
          path: |
            dist/apps/recados-*.zip
          if-no-files-found: error
          retention-days: 1

  apps-release:
    needs: [version, apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recados
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "$VERSION" recados-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  # The lake's platform and template in AWS, once the image is built. A failed job fails the run
  # before the deploy, and the running Hub keeps its image.
  aws-platform:
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-platform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  deploy:
    needs: [version, image, template, aws-platform]
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REFERENCE: ${{ needs.image.outputs.reference }}
          TEMPLATE: ${{ needs.template.outputs.template }}
        run: infra/deploy.sh "$REFERENCE" "$TEMPLATE"
      # Voltar atrás deploys only what is recorded here: a tag can be rewritten, a digest cannot.
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          REFERENCE: ${{ needs.image.outputs.reference }}
          TEMPLATE: ${{ needs.template.outputs.template }}
        run: infra/releases.sh record "$VERSION" "$REFERENCE" "$TEMPLATE"

  # After the Hub, from the merge commit. A failed step fails the run; the Hub stays
  # new and each Worker already published stays, and the rest keep the previous code.
  edge:
    needs: deploy
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: ${{ hashFiles('apps/edge/package.json') != '' }}
        uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: infra/publish-edge.sh
