name: hang probe (temporary)

# Temporary: proves the shards and e2e without --test-force-exit. Removed before the pull request
# is opened.
on:
  push:
    branches: [feat/conexus-ci-server-hang]

permissions:
  contents: read

env:
  CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
  NODE_COMPILE_CACHE: /tmp/node-compile-cache

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [head-1, head-2, head-3, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, e2e]
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] probe
      - uses: ./.github/actions/test-database # zizmor: ignore[self-repository] probe
        with:
          port: ${{ job.services.postgres.ports['5432'] }}
      - name: run
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          case "$LANE" in
            e2e)
              sed -i 's/"e2e": "node --test --test-force-exit /"e2e": "node --test /' package.json
              echo "force-exit left in package.json: $(grep -c 'force-exit' package.json)"
              start=$(date +%s); npm run e2e; echo "e2e exit=$? wall=$(( $(date +%s)-start ))s" ;;
            shard-*)
              export GITHUB_STEP_SUMMARY=/tmp/summary.md TEST_SHARD=${LANE#shard-}/6
              start=$(date +%s); npm test -w @conexus/server > /tmp/run.log 2>&1; rc=$?
              wall=$(( $(date +%s)-start ))
              files=$(grep -cE '^\| [0-9.]+ \| src/' /tmp/run.log)
              tests=$(grep -E '^\| [0-9.]+ \| src/' /tmp/run.log | awk -F'|' '{s+=$2} END {print int(s)}')
              tail -70 /tmp/run.log
              echo "shard $TEST_SHARD exit=$rc wall=${wall}s files=$files test-seconds=$tests" ;;
            head-*)
              hangs=0
              for i in $(seq 1 25); do
                rm -rf /tmp/node-compile-cache
                (cd apps/server && npm run build >/dev/null 2>&1 && MASTRA_AGENT_THREAD_LEASE_TTL_MS=3000 node --test --test-concurrency=1 --test-timeout=120000 --test-reporter=../../scripts/test-reporter.ts $(node ../../scripts/server-shards.ts 3/6 | head -4)) > /tmp/run.log 2>&1 &
                pid=$!
                while kill -0 $pid 2>/dev/null; do
                  sleep 5
                  if [ $(( $(date +%s) - $(stat -c %Y /tmp/run.log) )) -gt 120 ]; then hangs=$((hangs+1)); echo "HANG run $i"; tail -5 /tmp/run.log; pkill -KILL -f -- '--test'; break; fi
                done
                wait $pid; echo "run $i exit=$?"
              done
              echo "hangs=$hangs/25" ;;
          esac
