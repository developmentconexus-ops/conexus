name: Reiniciar o Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-server
  cancel-in-progress: false

jobs:
  restart:
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infra/deploy.sh --restart
