name: conexus

services:
  hub:
    image: ${HUB_IMAGE:?HUB_IMAGE must name the image by digest}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    secrets:
      - hub_database_url
      - hub_session_secret
      - hub_mail_token
      - hub_neon_api_key
      - hub_app_login_key
      - hub_cloudflare_apps_token
      - hub_seal_keys
    # HUB_MAIL_API_URL, HUB_MAIL_FROM, HUB_NEON_ORG_ID and HUB_CLOUDFLARE_ACCOUNT_ID: they name
    # accounts, so they stay out of Git.
    env_file: /etc/conexus/hub.env
    environment:
      HUB_DATABASE_URL_FILE: /run/secrets/hub_database_url
      HUB_PUBLIC_ORIGIN: https://hub.conexus.fun
      HUB_SESSION_SECRET_FILE: /run/secrets/hub_session_secret
      HUB_MAIL_TOKEN_FILE: /run/secrets/hub_mail_token
      HUB_NEON_API_URL: https://console.neon.tech/api/v2
      HUB_NEON_API_KEY_FILE: /run/secrets/hub_neon_api_key
      # The dispatcher's listener, reached over the Tunnel by Workers VPC: never under `ports:` (0041).
      HUB_EDGE_PORT: "8081"
      HUB_APPS_DOMAIN: conexusapp.tech
      # The apps' Workers and logins (decision 0043): the key the dispatcher holds too, and a token
      # apart from the edge's publish token.
      HUB_APP_LOGIN_KEY_FILE: /run/secrets/hub_app_login_key
      HUB_CLOUDFLARE_API_URL: https://api.cloudflare.com/client/v4
      HUB_CLOUDFLARE_APPS_TOKEN_FILE: /run/secrets/hub_cloudflare_apps_token
      HUB_APPS_NAMESPACE: conexus-apps
      # The installation's seal keys (security S32, S33): the last line seals, the others only open.
      HUB_SEAL_KEYS_FILE: /run/secrets/hub_seal_keys
      # The router's registry is the one bundled in the image, never refreshed (decision 0049).
      MASTRA_OFFLINE: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.HUB_PORT + '/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    image: ${HUB_IMAGE:?HUB_IMAGE must name the image by digest}
    init: true
    profiles:
      - migrate
    restart: "no"
    command: ["node", "apps/server/src/main.ts", "migrate"]
    secrets:
      - hub_database_url
      - hub_migration_database_url
    environment:
      HUB_DATABASE_URL_FILE: /run/secrets/hub_database_url
      HUB_MIGRATION_DATABASE_URL_FILE: /run/secrets/hub_migration_database_url

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    init: true
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      hub:
        condition: service_healthy

secrets:
  tunnel_token:
    file: /etc/conexus/secrets/tunnel_token
  hub_database_url:
    file: /etc/conexus/secrets/hub_database_url
  hub_migration_database_url:
    file: /etc/conexus/secrets/hub_migration_database_url
  hub_session_secret:
    file: /etc/conexus/secrets/hub_session_secret
  hub_mail_token:
    file: /etc/conexus/secrets/hub_mail_token
  hub_neon_api_key:
    file: /etc/conexus/secrets/hub_neon_api_key
  hub_app_login_key:
    file: /etc/conexus/secrets/hub_app_login_key
  hub_cloudflare_apps_token:
    file: /etc/conexus/secrets/hub_cloudflare_apps_token
  hub_seal_keys:
    file: /etc/conexus/secrets/hub_seal_keys
