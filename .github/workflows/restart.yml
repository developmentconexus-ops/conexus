name: Reiniciar o Hub

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template do Builder para experimentar, por exemplo conexus-builder:5a2ae2be; vazio mantém o que roda"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hub-server
  cancel-in-progress: false

jobs:
  restart:
    runs-on: [self-hosted, hub]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TEMPLATE: ${{ inputs.template }}
        run: infra/deploy.sh --restart "$TEMPLATE"
