name: CI

# A label re-runs the pull request, so the `all-removals` label runs every removal proof on it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every test file is a new Node process that compiles the server's 1963 modules again: the cache
# takes the import from 1.8 s to 1.3 s from the second process of a job on.
env:
  NODE_COMPILE_CACHE: /tmp/node-compile-cache

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deps
      - run: npm run knip
      - run: npm run docs
      - name: The OpenAPI document emits from the operations
        run: npm run openapi -- "$RUNNER_TEMP/openapi.json"
      - run: npm run suppressions
      - name: Complexity and new clones on the lines the pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run quality -- "origin/$BASE_REF" --fast
      - run: npm run boundaries
      - name: Approval of the step card
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: npm run approval -- ${BASE:+--base "$BASE"}
      - name: The method stays frozen while a step is in construction
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run method-freeze -- --base "origin/$BASE_REF" --labels "$LABELS"
      - name: Migrations carry no unmarked DROP or RENAME, no changed history or conflicting branches, no session state
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run migrations -- --base "origin/$BASE_REF"
      - name: List the new dependencies
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run new-dependencies -- --base "origin/$BASE_REF"
      - name: Report files outside the step's declared folders and contract owners
        if: github.event_name == 'pull_request'
        env:
          SHA: ${{ github.sha }}
        run: |
          grep -ohE '^## U[0-9]+' docs/steps/*.md | grep -oE 'U[0-9]+' | while read -r unit; do
            npm run radius -- "$unit" "$SHA" < /dev/null
          done
      # The workflows are code a pull request from inside the organization can change, so they are
      # read by the two checkers that know them: actionlint for syntax and shell, zizmor for
      # injection, permissions and unpinned actions. Each runs from an image fixed by digest (versions
      # in the comments); a finding is fixed in the workflow, and a false positive carries zizmor's own
      # inline ignore comment with the reason.
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # v1.7.12
      - name: zizmor
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo --env ZIZMOR_GITHUB_TOKEN ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --no-progress --color always .github # v1.31.1
      # Only a critical advisory fails the run: the lower ones are read in the step's output.
      - run: npm audit --audit-level=critical

  # The suites run as parallel jobs, each on its own runner: one job took the sum of them (8 to 9
  # minutes), and these take the longest of them. Each writes its slowest tests to the run summary.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: npm run test:scripts

  server:
    runs-on: ubuntu-24.04
    # Twice a shard's usual time: a test that hangs answers in 10 min, not 15.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - uses: ./.github/actions/test-database # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          port: ${{ job.services.postgres.ports['5432'] }}
      # One file at a time in a job: files that share CPU starve each other's real-time margins
      # and migrate.test.ts changes the roles of the whole server. The shards are the parallelism.
      # `--test-force-exit` ends a file's process once its tests are done: a failed test that leaves a
      # turn parked on a card keeps a timer alive, and its file used to hold the shard to the timeout.
      - run: npm test -w @conexus/server
        env:
          TEST_SHARD: ${{ matrix.shard }}/6

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: npm exec -w @conexus/web -- playwright-core install chromium-headless-shell
      # The screens in a real Chromium; their vitest half runs in packages, beside this job.
      - run: npm run test:browser -w @conexus/web
      - run: npm run build

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      # The check program drives a real Chromium (decision 0055).
      - run: npm exec -w @conexus/web -- playwright-core install chromium-headless-shell
      - run: npm test -w @conexus/app -w @conexus/app-contract -w @conexus/connectors -w @conexus/hub-api
      - run: npm run test:unit -w @conexus/web

  # The ready Sankhya reads against Sankhya's public documentation, downloaded here and kept nowhere
  # (it is Sankhya's, "Licença Sankhya"). Its own job, so a page that did not download reads as
  # "a documentação do Sankhya não baixou" and not as a mismatch.
  sankhya-docs:
    name: a documentação do Sankhya
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: npm run test:docs -w @conexus/connectors

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - uses: ./.github/actions/test-database # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          port: ${{ job.services.postgres.ports['5432'] }}
      - name: The founder's use script runs in a browser against a real Hub
        run: npm run e2e

  # A pull request proves the removals whose protected file, test file or row its diff changes
  # (scripts/removals-select.ts). Every push to main, and a pull request carrying the `all-removals`
  # label, proves all of them.
  removals-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.plan.outputs.base }}
      selected: ${{ steps.plan.outputs.selected }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - name: The removal rows this run proves
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && format('{{"title":{0},"headRef":{1},"labels":{2}}}', toJSON(github.event.pull_request.title), toJSON(github.head_ref), toJSON(github.event.pull_request.labels.*.name)) || '{}' }}
        run: |
          plan="$(node scripts/removals.ts --plan ${BASE:+--base "$BASE" --pull-request "$PULL_REQUEST"})"
          echo "$plan"
          {
            echo "base=$(jq -r 'if .everything then "" else env.BASE end' <<<"$plan")"
            echo "selected=$(jq .selected <<<"$plan")"
            echo "total=$(jq .shards <<<"$plan")"
            echo "shards=$(jq -c '[range(1; .shards + 1)]' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
          jq -r '"Removals: \(.selected) of \(.total) rows" + (if .selected == 0 then ", nothing to run" elif .everything then ", all because \(.everything)" else "" end)' <<<"$plan" >> "$GITHUB_STEP_SUMMARY"

  removals:
    needs: removals-plan
    if: needs.removals-plan.outputs.selected != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.removals-plan.outputs.shards) }}
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - uses: ./.github/actions/test-database # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          port: ${{ job.services.postgres.ports['5432'] }}
      - name: Each protection's test fails when the protection is taken out
        env:
          BASE: ${{ needs.removals-plan.outputs.base }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.removals-plan.outputs.total }}
        run: npm run removals -- ${BASE:+--base "$BASE"} --shard "$SHARD/$TOTAL"

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - uses: ./.github/actions/test-database # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          port: ${{ job.services.postgres.ports['5432'] }}
      - name: The mail bundle the host test imports exists
        run: npm run build -w @conexus/server
      - name: The image builds
        run: docker build --file infra/hub.Dockerfile --build-arg CONEXUS_VERSION=v0.0.0 --tag conexus-hub:ci .
      - name: The image carries the migration label and defines no NODE_ENV
        run: |
          label="$(docker image inspect --format '{{ index .Config.Labels "conexus.migrate" }}' conexus-hub:ci)"
          if [ "$label" != "1" ]; then
            echo "the image lacks the label conexus.migrate=1, so deploy.sh would skip migrate"
            exit 1
          fi
          if docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' conexus-hub:ci | grep -q '^NODE_ENV='; then
            echo "the image defines NODE_ENV"
            exit 1
          fi

      - name: The final image carries the system CA roots the sign-in program reads
        run: docker run --rm --entrypoint test conexus-hub:ci -s /etc/ssl/certs/ca-certificates.crt

      - name: The final image sends rendered HTML and text through the real Hub
        run: npm run test:image

  ci:
    if: always()
    needs: [check, scripts, server, web, packages, sankhya-docs, e2e, removals-plan, removals, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every job must have succeeded
        env:
          # No removal row to prove is a pass the plan job reported, never a job skipped for another reason.
          RESULTS: ${{ needs.check.result }} ${{ needs.scripts.result }} ${{ needs.server.result }} ${{ needs.web.result }} ${{ needs.packages.result }} ${{ needs.sankhya-docs.result }} ${{ needs.e2e.result }} ${{ needs.removals-plan.result }} ${{ needs.removals.result == 'skipped' && needs.removals-plan.result == 'success' && needs.removals-plan.outputs.selected == '0' && 'success' || needs.removals.result }} ${{ github.event_name == 'pull_request' && needs.image.result || 'success' }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a job ended as $result"
              exit 1
            fi
          done
      # Where the time went: the run's own record of each job and step, read back from GitHub, so
      # the job that held the run and the slowest step of every run are one click away and no
      # service holds the numbers. "Ended" counts from the first job's creation: the top row is the
      # end of the critical path, and a large "Queued" is runners, not tests.
      - name: The jobs and the slowest steps of this run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016 # the jq program is single-quoted so the shell leaves its $variables alone
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --paginate \
            --jq '.jobs[] | select(.completed_at != null and .name != "ci") | . as $job | {job: $job.name, created: ($job.created_at | fromdate), started: ($job.started_at | fromdate), ended: ($job.completed_at | fromdate), steps: [$job.steps[] | select(.completed_at != null and .started_at != null) | {step: .name, seconds: ((.completed_at | fromdate) - (.started_at | fromdate))}]}' \
            | jq -s -r '
              (map(.created) | min) as $start |
              "### Jobs, last to end first", "", "| Ended | Queued | Ran | Job |", "| ---: | ---: | ---: | --- |",
              (sort_by(-.ended)[] | "| \(.ended - $start) | \(.started - .created) | \(.ended - .started) | \(.job) |"), "",
              "### Slowest steps", "", "| Seconds | Job | Step |", "| ---: | --- | --- |",
              ([.[] | .job as $job | .steps[] | {job: $job, step, seconds}] | sort_by(-.seconds) | .[:15][] | "| \(.seconds) | \(.job) | \(.step) |")
            ' >> "$GITHUB_STEP_SUMMARY"
