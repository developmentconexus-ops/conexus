name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deps
      - run: npm run knip
      - run: npm run docs
      - name: The OpenAPI document emits from the operations
        run: npm run openapi -- "$RUNNER_TEMP/openapi.json"
      - run: npm run suppressions
      - name: Approval of the step card
        run: npm run approval -- ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      - name: The method stays frozen while a step is in construction
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run method-freeze -- --base "origin/${{ github.base_ref }}" --labels "$LABELS"
      - name: Migrations carry no unmarked DROP or RENAME, no changed history or conflicting branches, no session state
        if: github.event_name == 'pull_request'
        run: npm run migrations -- --base "origin/${{ github.base_ref }}"
      - name: List the new dependencies
        if: github.event_name == 'pull_request'
        run: npm run new-dependencies -- --base "origin/${{ github.base_ref }}"
      - name: Report changed code size against the step budget
        if: github.event_name == 'pull_request'
        run: npm run change-budget -- --base "origin/${{ github.base_ref }}"
      - name: Report files outside the step's declared folders and contract owners
        if: github.event_name == 'pull_request'
        run: |
          for unit in $(grep -oE '^## U[0-9]+' docs/steps/*.md | grep -oE 'U[0-9]+'); do
            npm run radius -- "$unit" "${{ github.sha }}"
          done

  # The suites run as parallel jobs, each on its own runner: one job took the sum of them (8 to 9
  # minutes), and these take the longest of them. Each writes its slowest tests to the run summary.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: npm run test:scripts

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_DATABASE_URL: postgres://conexus_owner:ci-owner@localhost:5432/postgres
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/test-database
      # One file at a time in a job: files that share CPU starve each other's real-time margins
      # and migrate.test.ts changes the roles of the whole server. The shards are the parallelism.
      - run: npm test -w @conexus/server
        env:
          TEST_SHARD: ${{ matrix.shard }}/4

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: npm test -w @conexus/web
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_DATABASE_URL: postgres://conexus_owner:ci-owner@localhost:5432/postgres
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/test-database
      - name: The founder's use script runs in a browser against a real Hub
        run: npm run e2e

  removals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONEXUS_TEST_DATABASE_URL: postgres://conexus_owner:ci-owner@localhost:5432/postgres
      CONEXUS_TEST_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/test-database
      - name: Each protection's test fails when the protection is taken out
        run: npm run removals -- --shard ${{ matrix.shard }}/3

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The image builds
        run: docker build --file infra/hub.Dockerfile --build-arg CONEXUS_VERSION=v0.0.0 --tag conexus-hub:ci .
      - name: The image carries the migration label and defines no NODE_ENV
        run: |
          label="$(docker image inspect --format '{{ index .Config.Labels "conexus.migrate" }}' conexus-hub:ci)"
          if [ "$label" != "1" ]; then
            echo "the image lacks the label conexus.migrate=1, so deploy.sh would skip migrate"
            exit 1
          fi
          if docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' conexus-hub:ci | grep -q '^NODE_ENV='; then
            echo "the image defines NODE_ENV"
            exit 1
          fi

  ci:
    if: always()
    needs: [check, scripts, server, web, e2e, removals, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.scripts.result }} ${{ needs.server.result }} ${{ needs.web.result }} ${{ needs.e2e.result }} ${{ needs.removals.result }} ${{ github.event_name == 'pull_request' && needs.image.result || 'success' }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a job ended as $result"
              exit 1
            fi
          done
      # Where the time went: the run's own record of each job and step, read back from GitHub, so
      # the slowest step of every run is one click away and no service holds the numbers.
      - name: The jobs and the slowest steps of this run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --paginate \
            --jq '.jobs[] | select(.completed_at != null and .name != "ci") | . as $job | {job: $job.name, seconds: (($job.completed_at | fromdate) - ($job.started_at | fromdate)), steps: [$job.steps[] | select(.completed_at != null and .started_at != null) | {step: .name, seconds: ((.completed_at | fromdate) - (.started_at | fromdate))}]}' \
            | jq -s -r '
              "### Jobs, longest first", "", "| Seconds | Job |", "| ---: | --- |",
              (sort_by(-.seconds)[] | "| \(.seconds) | \(.job) |"), "",
              "### Slowest steps", "", "| Seconds | Job | Step |", "| ---: | --- | --- |",
              ([.[] | .job as $job | .steps[] | {job: $job, step, seconds}] | sort_by(-.seconds) | .[:15][] | "| \(.seconds) | \(.job) | \(.step) |")
            ' >> "$GITHUB_STEP_SUMMARY"
