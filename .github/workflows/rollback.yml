name: Voltar atrás

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para pôr de volta, por exemplo v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hub-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/developmentconexus-ops/conexus-hub

jobs:
  rollback:
    runs-on: [self-hosted, hub]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the image kept for the version
        id: reference
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not a version name"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"; then
            echo "no image is kept for $VERSION"
            exit 1
          fi
          echo "reference=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - env:
          REFERENCE: ${{ steps.reference.outputs.reference }}
        run: infra/deploy.sh "$REFERENCE"
