name: Install
description: The pinned Node and the locked dependencies, with npm's download cache kept between runs under the lockfile's hash.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
      shell: bash
